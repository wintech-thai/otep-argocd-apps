apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otep-postgres-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-secret-store      # name of the SecretStore (or kind specified)
  target:
    name: otep-postgres-secret       # name of the k8s Secret to be created
  data:
  {{- if eq .Values.envGroup "prod" }}
  - secretKey: adminPasswordKey
    remoteRef:
      key: initial-secret
      property: PG_PASSWORD_PROD
  {{- else if eq .Values.envGroup "dev" }}
  - secretKey: adminPasswordKey
    remoteRef:
      key: initial-secret
      property: PG_PASSWORD_DEV
  {{- end }}
