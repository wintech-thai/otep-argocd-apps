apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: otep-apis-cert
spec:
  secretName: otep-apis-cert
  dnsNames:
    - {{ .Values.domainOtepAPI }}
  issuerRef:
    name: lets-encrypt-issuer-prod
    kind: ClusterIssuer
    group: cert-manager.io

{{- if eq .Values.envGroup "prod" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: otep-apis-cert2
spec:
  secretName: otep-apis-cert2
  dnsNames:
    - {{ .Values.domainOtepAPI2 }}
  issuerRef:
    name: lets-encrypt-issuer-prod
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
