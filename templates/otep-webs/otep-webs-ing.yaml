apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otep-webs-ing
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.org/client-max-body-size: 50m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - {{ .Values.domainOtepWeb }}
      secretName: otep-webs-cert
  rules:
    - host: {{ .Values.domainOtepWeb }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: otep-{{ .Values.envGroup }}-otep-webs
                port:
                  number: 80
