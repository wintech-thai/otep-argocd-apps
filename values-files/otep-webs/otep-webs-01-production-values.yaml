otep-webs:
  pods:
    replicas: 1

    resources:
      limits:
        cpu: 300m
        memory: 350Mi
      requests:
        cpu: 150m
        memory: 100Mi

    env:
      - name: ENV_GROUP
        value: 'prod'

      - name: ENV_RUN
        value: 'Production'

      - name: NODE_ENV
        value: 'Production'

      - name: NEXT_PUBLIC_API_URL
        value: 'https://api.otep.triple-t.co' # เปลี่ยนเป็น https://ddc-api.otep.go.th ก็ได้ในอนาคต
